{% set version = '1.3.4' %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-giant
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/GiANT_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/GiANT/GiANT_{{ version }}.tar.gz
  sha256: f30249e33bc3571b300ba4059a68032573b71dd47dadbd1db52d28645554fb05

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
  run:
    - r-base

test:
  commands:
    - $R -e "library('GiANT')"           # [not win]
    - "\"%R%\" -e \"library('GiANT')\""  # [win]

about:
  home: https://CRAN.R-project.org/package=GiANT
  dev_url: https://github.com/cran/GiANT
  license: Artistic-2.0
  summary: Toolbox for various enrichment analysis methods and quantification of uncertainty
    of gene sets, Schmid et al. (2016) <doi:10.1093/bioinformatics/btw030>.
  license_family: OTHER
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/Artistic-2.0'

extra:
  recipe-maintainers:
    - conda-forge/r
